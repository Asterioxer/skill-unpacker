name: Desktop Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-desktop:
    name: Verify Electron App on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install root & workspaces
        run: npm install

      - name: Verify desktop bundle
        working-directory: apps/desktop
        run: node -e "require('skill-unpacker'); console.log('Desktop dependency resolved successfully');"
